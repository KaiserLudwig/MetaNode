# 仅用于源码验证（forge verify-contract）：复用 node_modules 依赖，输出目录与 Hardhat 分离
[profile.default]
src = "contracts"
test = "test"
out = "forge-out"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "@chainlink/contracts/=node_modules/@chainlink/contracts/",
]
